name: Worker daily ingestion

on:
  schedule:
    - cron: "0 7,11 * 11,12,1,2,3,4 *" # Every day from Nov to Apr at 07:00 and 11:00 UTC (08:00/12:00 in winter, 09:00/13:00 in summer time in Paris).
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: Production

    defaults:
      run:
        working-directory: worker

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WEB_REVALIDATE_URL: ${{ secrets.WEB_REVALIDATE_URL }}
      WEB_REVALIDATE_SECRET: ${{ secrets.WEB_REVALIDATE_SECRET }}
      ACTIVE_RESORT_LOOKBACK_DAYS: 7
      ACTIVE_RESORT_MIN_RECORD_DAYS: 2
      NTFY_TOPIC: ouskier-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run ingestion worker
        run: npm run dev
